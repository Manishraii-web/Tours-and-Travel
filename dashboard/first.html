<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        *{
            margin: 0;
            text-decoration: none;
            box-sizing: border-box;
            appearance: none;
            border: 0;
        }
        body {
            display: flex;
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
           
        }

        .container {
            display: flex;
            width: 100%;
            gap:1px;
            margin: 0 auto;
        }

        .left {
            width: 20%;
            background-color: rgb(217, 217, 231);
            border: 1px solid white;
            border-radius: 0px 5px 5px 0;
            box-shadow: 0 4px 6px rgba(123, 11, 11, 0.1);
            transition: transform 0.3s ease-in-out;
           

        }

        .left:hover {
            transform: scale(1.05);
        }

        .left h1 {
            text-align: center;
            color:Red;
            margin-bottom: 20px;
            margin-top: 20px;
            font-weight: 600;
        }

        .set,
        .close {
            /* font-weight: 900; */
            font-size: x-large;
        }

        .mid {
            width: 60%;
            background-color: lightblue;
        }

        .right {
            width: 20%;
            background-color: lightgreen;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="left">

           <h1>Yatra's</h1>
            <!--  <div class="set"> <span class="material-symbols-outlined"> settings</span> Settings </div>

                </a>

                <a href="#">

                    <h3>Customers</h3>
                </a>

                <a href="#">
                    <span class="material-symbols-outlined">insights</span>
                    <h3>Analytics</h3>
                </a>

                <a href="#">
                    <span class="material-symbols-outlined">receipt_long</span>
                    <h3>Products</h3>
                </a>

                <a href="#">
                    <span class="material-symbols-outlined">report</span>
                    <h3>Reports</h3>
                </a>

                <a href="#">
                    <span class="material-symbols-outlined">settings</span>
                    <h3>Settings</h3>
                </a>

                <a href="#">
                    <span class="material-symbols-outlined">add</span>
                    <h3>Add Products</h3>

                <a href="#">
