<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking List</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #007bff;
            margin-bottom: 30px;
        }

        .hotel-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .hotel-card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .hotel-card:hover {
            transform: translateY(-5px);
        }

        .hotel-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .hotel-info {
            padding: 15px;
        }

        .hotel-info h2 {
            margin: 0 0 10px;
            font-size: 20px;
            color: #333;
        }

        .hotel-info p {
            margin: 5px 0;
            color: #666;
        }

        .hotel-info .price {
            font-size: 18px;
            color: #28a745;
            font-weight: bold;
        }

        .hotel-info button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .hotel-info button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hotel Booking List</h1>
        <div class="hotel-list">
            <!-- Hotel Card 1 -->
            <div class="hotel-card">
                <img src="https://via.placeholder.com/300x200" alt="Hotel Image" class="hotel-image">
                <div class="hotel-info">
                    <h2>manish ko ghar</h2>
                    <p>Location: Gathaghar</p>
                    <p class="price">15o rupeya lega/night</p>
                    <button>Book Now</button>
                </div>
            </div>

            <!-- Hotel Card 2 -->
            <div class="hotel-card">
                <img src="https://via.placeholder.com/300x200" alt="Hotel Image" class="hotel-image">
                <div class="hotel-info">
                    <h2></h2>rahul ko room</h2>
                    <p>Location: Koteshwor</p>
                    <p class="price"> 500 lega/night</p>
                    <button>Book Now</button>
                </div>
            </div>

            <!-- Hotel Card 3 -->
            <div class="hotel-card">
                <img src="https://via.placeholder.com/300x200" alt="Hotel Image" class="hotel-image">
                <div class="hotel-info">
                    <h2>Rahul ko arko room</h2>
                    <p>Location: tinkune</p>
                    <p class="price">1 rupe lega/night</p>
                    <button>Book Now</button>
                </div>
            </div>

            <!-- Hotel Card 4 -->
            <div class="hotel-card">
                <img src="https://via.placeholder.com/300x200" alt="Hotel Image" class="hotel-image">
                <div class="hotel-info">
                    <h2>Everst hotel</h2>
                    <p>Location: Baneshwor</p>
                    <p class="price">1040/night</p>
                    <button>Book Now</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
